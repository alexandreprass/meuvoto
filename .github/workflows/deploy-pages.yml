name: Deploy Apuração 2026 to Meu Voto

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do painel eleitoral
        uses: actions/checkout@v4
        with:
          repository: alexandreprass/apuracao-tse-2026
          ref: main
          path: site
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Instalar dependências
        run: npm ci
        working-directory: ./site
      - name: Ajustar endereço canônico para Meu Voto
        run: sed -i 's|https://alexandreprass.github.io/apuracao-tse-2026/|https://meuvoto.digital/|g' index.html
        working-directory: ./site
      - name: Compilar para o domínio Meu Voto
        run: npm run build -- --base=/
        working-directory: ./site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
