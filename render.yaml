databases:
  - name: meuvoto-db
    plan: free
    databaseName: meuvoto
    user: meuvoto
    region: oregon

services:
  - type: web
    name: meuvoto
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/results
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_URL
        value: https://meuvoto.onrender.com
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: AUTH_TWITTER_ID
        sync: false
      - key: AUTH_TWITTER_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: meuvoto-db
          property: connectionString
